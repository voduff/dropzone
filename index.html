<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dropzone</title>
  <style>
    :root { --bg: #1b2a4a; --fg: #f4f6fb; --accent: #f5c242; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 18px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    h1 { font-size: clamp(48px, 10vw, 96px); margin: 0; color: var(--accent); font-style: italic; letter-spacing: 2px; }
    p { opacity: .85; max-width: 560px; }
  </style>
</head>
<body>
  <main>
    <h1>DROPZONE</h1>
    <p>An offline battle royale: you against up to 24 bots on a hand-built island.<br>
       The playable browser build is being uploaded — check back in a few minutes.</p>
  </main>
</body>
</html>
