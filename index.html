<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Dropzone</title>
  <style>
    :root { --bg: #1b2a4a; --fg: #f4f6fb; --accent: #f5c242; --bar: #2c3e66; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
                 font: 16px/1.4 system-ui, sans-serif; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: var(--bg);
                    outline: none; }
    #loader { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px;
              background: radial-gradient(circle at 50% 35%, #2f4a7d, var(--bg) 70%); }
    #loader h1 { margin: 0 0 8px; font-size: clamp(48px, 10vw, 96px); font-style: italic; letter-spacing: 2px;
                 color: var(--accent); text-shadow: 0 6px 0 #9c6b10; }
    #loader p { margin: 6px 0; opacity: .85; }
    #bar { width: min(420px, 80vw); height: 14px; margin: 18px auto 6px; background: var(--bar); border-radius: 7px;
           overflow: hidden; }
    #fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    #hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 8px 14px;
            background: rgba(0,0,0,.55); border-radius: 8px; font-size: 14px; pointer-events: none;
            transition: opacity .6s; }
    #error { color: #ff8a80; max-width: 560px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <div>
      <h1>DROPZONE</h1>
      <p>Offline battle royale — you vs. up to 24 bots</p>
      <div id="bar"><div id="fill"></div></div>
      <p id="status">Loading…</p>
      <p id="error" class="hidden"></p>
    </div>
  </div>
  <div id="hint" class="hidden">Click the game to capture the mouse · releasing the mouse (Esc) pauses</div>
  <script>
    var canvas = document.getElementById("unity-canvas");
    var fill = document.getElementById("fill");
    var statusEl = document.getElementById("status");
    var config = {
      dataUrl: "Build/WebGL.data.unityweb",
      frameworkUrl: "Build/WebGL.framework.js.unityweb",
      codeUrl: "Build/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Dropzone",
      productName: "Dropzone",
      productVersion: "0.1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    };
    var script = document.createElement("script");
    script.src = "Build/WebGL.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        fill.style.width = Math.round(p * 100) + "%";
        statusEl.textContent = p < 0.9 ? "Downloading… " + Math.round(p * 100) + "%" : "Starting…";
      }).then(function () {
        document.getElementById("loader").classList.add("hidden");
        var hint = document.getElementById("hint");
        hint.classList.remove("hidden");
        setTimeout(function () { hint.style.opacity = "0"; }, 7000);
        canvas.focus();
      }).catch(function (message) {
        var e = document.getElementById("error");
        e.textContent = "Could not start the game: " + message + " (a desktop browser with WebGL 2 is required)";
        e.classList.remove("hidden");
        statusEl.classList.add("hidden");
      });
    };
    document.body.appendChild(script);
    canvas.addEventListener("click", function () { canvas.focus(); });
  </script>
</body>
</html>
